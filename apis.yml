apis:
- aid: micro-connect-open-platform
  name: Micro Connect Open Platform API
  description: >-
    The private HTTP API behind the Micro Connect Open Platform (滴灌通开放平台), the
    enterprise console brands and merchants use to register, submit daily revenue and order
    detail reports, review data, manage authorisation files and export settlement data. The
    console is a browser SPA served from open.microconnect.com; every request it makes goes
    to the Apache ShenYu gateway at api.mcisaas.com under the /api prefix and is
    bearer-authenticated against the Keycloak realm numa-realm at kc.mcisaas.com. Micro
    Connect publishes no OpenAPI, no reference documentation and no developer portal for
    this surface — it is reachable only after enterprise account registration and login.
  humanURL: https://open.microconnect.com/
  baseURL: https://api.mcisaas.com/api
  tags:
  - Revenue Reporting
  - Merchant Onboarding
  - Settlement
