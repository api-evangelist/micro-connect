aid: micro-connect
name: Micro Connect
description: >-
  Micro Connect (滴灌通) is a Hong Kong-founded financial market infrastructure group,
  established in 2021 by Charles Li (former CEO of Hong Kong Exchanges and Clearing) and
  Gary Zhang, that turns the daily revenue of micro, small and medium businesses into a
  standardised, tradable asset class. Its Daily Revenue Obligation (DRO) and revenue-based
  financing contracts are listed, cleared and settled on the Micro Connect (Macao)
  Financial Assets Exchange (MCEX) — a financial institution approved by Macao executive
  order Ordem Executiva n.º 47/2022 and regulated by the Monetary Authority of Macao, and
  wholly owned by Micro Connect Group. The group runs several operator-facing web platforms
  on its own SaaS stack — the Micro Connect Open Platform (open.microconnect.com) for brand
  and merchant data onboarding, the M-Terminal investor terminal (mt.microconnect.com), and
  the store/merchant consoles — all served from a single API gateway at api.mcisaas.com and
  authenticated by a Keycloak identity provider at kc.mcisaas.com. No public developer
  program, API reference or machine-readable API contract is published; the integration
  surface is reachable only after enterprise account registration and login.
