operational_findings:
- severity: high
  finding: >-
    The Micro Connect Open Platform serves an EXPIRED TLS certificate. open.microconnect.com
    (valid Google Trust Services certificate) 301-redirects to open.microconnect.cn, whose
    certificate — C=CN, O=滴灌通管理咨询（海南）有限公司, CN=microconnect.cn, issued by GeoTrust CN
    RSA CA G1 — expired on 2024-11-27, roughly nine months before this probe. Any standard
    HTTP client, SDK or agent reaching the Open Platform fails TLS verification; only a browser
    user clicking through the interstitial gets in.
  observed: '2026-08-25'
  evidence: 'openssl s_client -connect open.microconnect.cn:443 -> notAfter=Nov 27 23:59:59 2024 GMT'
- severity: medium
  finding: >-
    open.microconnect.cn returned HTTP 503 on every /.well-known/* probe in this pass, while
    the application root returned 200 — an inconsistent edge configuration.
  observed: '2026-08-25'
- severity: low
  finding: >-
    api.mcisaas.com returns HTTP 200 for every unmatched path, carrying the Apache ShenYu
    envelope {"code":-107,"message":"divide:Can not find selector, please check your
    configuration!"}. A soft-200 on unknown routes makes the gateway indistinguishable from a
    working endpoint to any client that checks status codes.
  observed: '2026-08-25'
