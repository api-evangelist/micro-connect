observations:
- >-
  Strong protocol capability, zero developer-facing exposure: the identity provider supports
  PKCE (S256), Pushed Authorization Requests, mTLS-bound access tokens, private_key_jwt and
  CIBA — a FAPI-grade toolkit — but none of it is documented anywhere a prospective
  integrator can read, and no client can be obtained without an enrolled enterprise account.
- >-
  The `implicit` and `password` grants are still advertised as supported on both realms.
  Both are discouraged by OAuth 2.0 Security Best Current Practice (RFC 9700) and removed in
  OAuth 2.1; this is a Keycloak default rather than an explicit Micro Connect decision, but
  it is what the discovery document advertises today.
