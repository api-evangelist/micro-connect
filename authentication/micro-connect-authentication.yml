summary: >-
  The Micro Connect SaaS estate authenticates against a self-hosted Keycloak identity
  provider at kc.mcisaas.com using OpenID Connect / OAuth 2.0. There is no API-key surface,
  no public client registration, and no published developer credential flow — an integrator
  must first be registered as an enterprise account on the Open Platform.
