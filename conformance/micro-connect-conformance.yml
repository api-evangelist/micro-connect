note: >-
  Micro Connect publishes no security-certification trust centre (no SOC 2, ISO 27001, PCI
  DSS or HIPAA claim was found anywhere on its public surface). What it does publish is a
  named financial-services regulatory authorisation for MCEX and a set of market rule
  documents. Both are recorded below with the exact page they came from. Nothing here is
  inferred from the company's sector.
standards:
- id: oauth2
  conforms: true
  evidence: >-
    kc.mcisaas.com serves RFC 8414-shaped OAuth 2.0 / OIDC discovery documents for two realms,
    with authorization, token, introspection, revocation, device-authorization and pushed
    authorization request endpoints.
- id: oidc
  conforms: true
  evidence: >-
    OpenID Provider Configuration documents at
    /auth/realms/{master,numa-realm}/.well-known/openid-configuration, HTTP 200, advertising
    id_token signing algorithms, userinfo, jwks_uri and end_session_endpoint.
- id: pkce
  conforms: true
  evidence: 'code_challenge_methods_supported: [plain, S256] in both realm discovery documents.'
- id: oauth2-par
  conforms: true
  evidence: >-
    pushed_authorization_request_endpoint present;
    require_pushed_authorization_requests is false.
- id: mtls-bound-tokens
  conforms: true
  evidence: >-
    tls_client_certificate_bound_access_tokens is true and a full mtls_endpoint_aliases block
    is published in both realm discovery documents.
- id: fapi
  conforms: false
  evidence: >-
    The building blocks FAPI requires (PAR, mTLS-bound tokens, private_key_jwt, S256) are all
    advertised, but the realms still advertise the implicit and password grants and do not
    require PAR, and Micro Connect makes no FAPI conformance claim. No FAPI certification was
    found on the OpenID Foundation certification register or on any Micro Connect page.
- id: rfc9457
  conforms: false
  evidence: >-
    The api.mcisaas.com gateway returns a bespoke {"code":<int>,"message":<string>,"data":null}
    envelope with content-type application/json, not application/problem+json. Observed live
    on 2026-08-25.
- id: openapi
  conforms: false
  evidence: >-
    No OpenAPI or Swagger document is served on any Micro Connect host. Probed
    /openapi.json, /openapi.yaml, /swagger.json, /v1/openapi.json, /v2/api-docs, /v3/api-docs,
    /api-docs, /doc.html, /swagger-ui.html, /docs and /redoc against www.microconnect.com and
    api.mcisaas.com — all 404 (marketing host) or ShenYu soft-200 (gateway host).
